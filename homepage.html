<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generative Grid Tool</title>

    <!-- Adobe Fonts -->
    <link rel="stylesheet" href="https://use.typekit.net/jmw3kod.css" />
    <link rel="stylesheet" href="https://use.typekit.net/ixo4klv.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="index.css" />
</head>
<body>

    
    <div class="button-group">
        <div class="name">GENERATIVE GRID TOOL!</div>
        <div class="fill">FILL OPTIONS:</div>
        <div class="class">JS'25</div>
        <button class="button" id="b1">+ GRID</button>
        <button class="button" id="b2">SOLID</button>
        <button class="button" id="b3">CHECKER</button>
        <button class="button" id="b4">CIRCLE</button>
        <button class="button" id="b5">INVERT</button>
        <button class="button" id="reset">RESET</button>
        
    </div>
    <button id="saveBtn">SAVE IMG</button>

    <div class="undo">CLICK "Z" TO UNDO</div>
    <div id="color-box">
    <input type="color" id="colorPicker" value="#000000" />
    PICK COLOR
</div>
    <!-- p5.js and scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="index.js"></script>
    
</body>
</html>
